<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#075c55">
    <title>Clinic Admin Editor</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/admin-style.css">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17343a;
        background: #f1f7f6;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 12% 12%, rgba(108, 214, 193, .22), transparent 36%),
          radial-gradient(ellipse at 88% 90%, rgba(80, 168, 180, .14), transparent 38%),
          #f1f7f6;
      }

      .login-card {
        width: min(100%, 440px);
        padding: clamp(26px, 7vw, 44px);
        border: 1px solid #d6e5e3;
        border-radius: 24px;
        background: rgba(255, 255, 255, .96);
        box-shadow: 0 24px 70px rgba(27, 74, 77, .12);
        text-align: center;
      }

      .brand-mark {
        display: grid;
        width: 58px;
        height: 58px;
        margin: 0 auto 22px;
        place-items: center;
        border-radius: 18px;
        color: #fff;
        background: linear-gradient(145deg, #18a9a0, #075c55);
        box-shadow: 0 8px 20px rgba(7, 92, 85, .2);
        font-size: 30px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        color: #14373c;
        font-size: clamp(1.6rem, 6vw, 2rem);
        letter-spacing: -.035em;
      }

      .intro {
        margin: 12px 0 26px;
        color: #526a6e;
        line-height: 1.65;
      }

      .sign-in {
        width: 100%;
        min-height: 52px;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: #087c70;
        box-shadow: 0 6px 16px rgba(8, 124, 112, .2);
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      .sign-in:hover { background: #06665d; }

      .local-note {
        margin: 18px 0 0;
        padding: 12px 14px;
        border: 1px solid #e8cf9e;
        border-radius: 12px;
        color: #5a4520;
        background: #fff8e9;
        font-size: .9rem;
        line-height: 1.6;
      }

      :where(button, a):focus-visible {
        outline: 3px solid #d27620;
        outline-offset: 3px;
      }

      .help {
        margin: 18px 0 0;
        color: #617579;
        font-size: .9rem;
        line-height: 1.6;
      }

      .status {
        min-height: 1.5em;
        margin: 14px 0 0;
        color: #8a351f;
        font-size: .92rem;
      }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="login-card" id="loading-card">
      <div class="brand-mark" aria-hidden="true">+</div>
      <h1>Clinic Admin</h1>
      <p class="intro">Manage clinic information, services, opening hours, the blog, and shop products.</p>
      <p class="help" id="loading-message">Loading the secure admin dashboard…</p>
      <p class="local-note" id="local-note" hidden>Local preview cannot sign in or save CMS changes. Open the live admin to manage the published site.</p>
      <p class="status" id="login-status" role="status" aria-live="polite"></p>
    </main>
    <div id="nc-root"></div>
    <script>
      (() => {
        const loadingCard = document.getElementById("loading-card");
        const localNote = document.getElementById("local-note");
        const loginStatus = document.getElementById("login-status");

        function showLoginError(message) {
          loadingCard.hidden = false;
          loginStatus.textContent = message;
        }

        if (["localhost", "127.0.0.1", "::1"].includes(window.location.hostname)) {
          const liveAdminLink = document.createElement("a");
          liveAdminLink.className = "sign-in";
          liveAdminLink.href = "https://snazzy-jelly-8dcd0f.netlify.app/admin/";
          liveAdminLink.textContent = "Open live admin";
          document.getElementById("loading-message").replaceWith(liveAdminLink);
          localNote.hidden = false;
          return;
        }

        const cmsScript = document.createElement("script");
        cmsScript.src = "https://unpkg.com/decap-cms@3.17.0/dist/decap-cms.js";
        cmsScript.onload = () => {
          loadingCard.hidden = true;
          const adminRoot = document.getElementById("nc-root");
          const backdrop = document.createElement("button");
          backdrop.className = "clinic-admin-sidebar-backdrop";
          backdrop.type = "button";
          backdrop.setAttribute("aria-label", "Close admin navigation");
          document.body.append(backdrop);

          const closeMenu = () => {
            const wasOpen = document.body.classList.contains("clinic-admin-menu-open");
            document.body.classList.remove("clinic-admin-menu-open");
            const menuButton = adminRoot.querySelector(".clinic-admin-mobile-menu");
            menuButton?.setAttribute("aria-expanded", "false");
            const sidebar = adminRoot.querySelector('aside[class*="SidebarContainer"]');
            if (sidebar) sidebar.inert = window.matchMedia("(max-width: 767px)").matches;
            const main = adminRoot.querySelector('main[class*="CollectionMain"]');
            if (main) main.inert = false;
            if (wasOpen) menuButton?.focus();
          };
          backdrop.addEventListener("click", closeMenu);
          document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && document.body.classList.contains("clinic-admin-menu-open")) {
              closeMenu();
            }
          });

          const installDashboardLinks = () => {
            const header = adminRoot.querySelector('[class*="AppHeaderContent"]');
            if (!header || header.querySelector(".clinic-admin-header-actions")) return;
            const actions = document.createElement("nav");
            actions.className = "clinic-admin-header-actions";
            actions.setAttribute("aria-label", "Clinic website links");
            actions.innerHTML = '<a class="clinic-admin-dashboard-link" href="/admin/"><i class="fa-solid fa-house-medical" aria-hidden="true"></i><span>Dashboard</span></a><a class="clinic-admin-dashboard-link clinic-admin-site-link" href="/" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i><span>View website</span></a>';
            header.append(actions);
          };

          const installMobileMenu = () => {
            const header = adminRoot.querySelector('[class*="AppHeaderContent"]');
            if (!header || header.querySelector(".clinic-admin-mobile-menu")) return;
            const menuButton = document.createElement("button");
            menuButton.className = "clinic-admin-mobile-menu";
            menuButton.type = "button";
            menuButton.setAttribute("aria-label", "Open admin navigation");
            menuButton.setAttribute("aria-controls", "clinic-admin-navigation");
            menuButton.setAttribute("aria-expanded", "false");
            menuButton.innerHTML = '<i class="fa-solid fa-bars" aria-hidden="true"></i>';
            menuButton.addEventListener("click", () => {
              const isOpen = document.body.classList.toggle("clinic-admin-menu-open");
              menuButton.setAttribute("aria-expanded", String(isOpen));
              menuButton.setAttribute("aria-label", isOpen ? "Close admin navigation" : "Open admin navigation");
              const sidebar = adminRoot.querySelector('aside[class*="SidebarContainer"]');
              if (sidebar) sidebar.inert = !isOpen && window.matchMedia("(max-width: 767px)").matches;
              const main = adminRoot.querySelector('main[class*="CollectionMain"]');
              if (main) main.inert = isOpen;
              if (isOpen) sidebar?.querySelector("a[data-testid]")?.focus();
              else menuButton.focus();
            });
            header.prepend(menuButton);
          };

          const installNavigationLabel = () => {
            const sidebar = adminRoot.querySelector('aside[class*="SidebarContainer"]');
            const menuButton = adminRoot.querySelector(".clinic-admin-mobile-menu");
            if (menuButton) menuButton.hidden = !sidebar;
            if (sidebar) {
              sidebar.id = "clinic-admin-navigation";
              sidebar.setAttribute("aria-label", "Clinic admin sections");
              const heading = sidebar.querySelector("h2");
              if (heading && heading.textContent !== "Manage clinic website") {
                heading.textContent = "Manage clinic website";
              }
              const search = sidebar.querySelector('input[type="search"], input[placeholder*="Search"]');
              if (search && search.placeholder !== "Search clinic sections") {
                search.placeholder = "Search clinic sections";
              }
              sidebar.inert = window.matchMedia("(max-width: 767px)").matches &&
                !document.body.classList.contains("clinic-admin-menu-open");
            }
          };
          const installEnhancements = () => {
            installDashboardLinks();
            installMobileMenu();
            installNavigationLabel();
          };
          new MutationObserver(installEnhancements).observe(adminRoot, { childList: true, subtree: true });
          adminRoot.addEventListener("click", (event) => {
            const collectionLink = event.target instanceof Element
              ? event.target.closest('aside[class*="SidebarContainer"] a[data-testid]')
              : null;
            if (collectionLink) closeMenu();
          });
          window.addEventListener("resize", closeMenu);
          installEnhancements();
        };
        cmsScript.onerror = () => {
          showLoginError("The editor could not load. Check your internet connection and the admin Content Security Policy, then reload.");
        };
        document.head.append(cmsScript);
      })();
    </script>
  </body>
</html>
