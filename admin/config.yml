backend:
  name: turbo-github
  turbo_site_id: 6d6f71a4-8bce-407f-9b96-e06050276cdd
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "clinic-profile"
    label: "Clinic profile"
    files:
      - name: "profile"
        label: "Doctor and contact details"
        file: "js/content/clinic-profile.json"
        format: "json"
        fields:
          - label: "Clinic and doctor"
            name: "doctorInfo"
            widget: "object"
            fields:
              - { label: "Doctor or clinic name", name: "name", widget: "string" }
              - { label: "Specialty", name: "specialty", widget: "string" }
              - { name: "specialtyHi", widget: "hidden" }
              - { label: "Biography", name: "bio", widget: "text", required: false, hint: "Use clinic-approved, verified details and credentials." }
              - { name: "bioAr", widget: "hidden" }
              - { name: "bioHi", widget: "hidden" }
              - { label: "Phone number with country code", name: "phone", widget: "string" }
              - { label: "Email address", name: "email", widget: "string" }
              - { label: "WhatsApp number with country code", name: "whatsapp", widget: "string" }
              - { label: "Clinic address", name: "address", widget: "string" }
              - { label: "Google Maps embed URL", name: "googleMapsEmbed", widget: "string" }
              - { label: "Directions URL override", name: "directionsUrl", widget: "string", required: false, hint: "Optional. Leave blank to use the address for directions." }
              - { label: "Parking details", name: "parking", widget: "text", required: false }
              - { name: "parkingAr", widget: "hidden" }
              - { name: "parkingHi", widget: "hidden" }
              - { label: "Accessibility information", name: "accessibility", widget: "text", required: false }
              - { name: "accessibilityAr", widget: "hidden" }
              - { name: "accessibilityHi", widget: "hidden" }
              - { label: "Google Business Profile URL", name: "googleBusinessProfile", widget: "string", required: false }
              - label: "Social media links"
                name: "socialProfiles"
                widget: "object"
                fields:
                  - { label: "Instagram", name: "instagram", widget: "string", required: false }
                  - { label: "Facebook", name: "facebook", widget: "string", required: false }
                  - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }

  - name: "opening-hours"
    label: "Opening hours"
    files:
      - name: "hours"
        label: "Weekly schedule"
        file: "js/content/opening-hours.json"
        format: "json"
        fields:
          - label: "Days and hours"
            name: "hours"
            widget: "list"
            summary: "{{fields.day}} — {{fields.hours}}"
            fields:
              - { label: "Day", name: "day", widget: "string" }
              - { name: "dayAr", widget: "hidden" }
              - { name: "dayHi", widget: "hidden" }
              - { label: "Opening hours", name: "hours", widget: "string", hint: "For example: 8:00 AM–5:00 PM or Closed." }
              - { name: "hoursAr", widget: "hidden" }
              - { name: "hoursHi", widget: "hidden" }

  - name: "site-settings"
    label: "Website settings"
    files:
      - name: "settings"
        label: "Features, booking and payments"
        file: "js/content/site-settings.json"
        format: "json"
        fields:
          - { label: "Enable online shop", name: "shopEnabled", widget: "boolean", default: true, hint: "Turn off the shop without deleting its products." }
          - { label: "Enable blog", name: "blogEnabled", widget: "boolean", default: true, hint: "Turn off the blog page and its navigation links." }
          - { label: "Hosted appointment booking page", name: "bookingUrl", widget: "string", required: false, hint: "Paste the clinic's public booking page URL. Leave blank to use the existing appointment form." }
          - { label: "Clinic introduction video URL", name: "introVideoUrl", widget: "string", required: false, hint: "Optional YouTube URL. The video section is hidden if this is blank." }
          - { label: "Enable myFatoorah payment links", name: "paymentLinks", widget: "object", fields: [{ label: "Enable configured links", name: "enabled", widget: "boolean", default: false, hint: "Only enable after testing the clinic's merchant account. Payment is handled by myFatoorah." }] }
          - { label: "Cloudflare Web Analytics site token", name: "cloudflareWebAnalyticsToken", widget: "string", required: false, hint: "Optional public site token. Do not enter an API key or secret." }

  - name: "services"
    label: "Services"
    files:
      - name: "services"
        label: "Clinic services"
        file: "js/content/services.json"
        format: "json"
        fields:
          - label: "Services"
            name: "services"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Service name", name: "name", widget: "string" }
              - { name: "nameAr", widget: "hidden" }
              - { name: "nameHi", widget: "hidden" }
              - { label: "Description", name: "description", widget: "text" }
              - { name: "descriptionAr", widget: "hidden" }
              - { name: "descriptionHi", widget: "hidden" }
              - { label: "Typical duration", name: "duration", widget: "string", required: false }
              - { name: "durationAr", widget: "hidden" }
              - { name: "durationHi", widget: "hidden" }
              - { label: "Fee information", name: "fee", widget: "string", required: false, hint: "Use 'Confirm with clinic' unless the price is current and confirmed." }
              - { name: "feeAr", widget: "hidden" }
              - { name: "feeHi", widget: "hidden" }
              - { label: "What to expect", name: "details", widget: "list", required: false, field: { label: "Detail", name: "detail", widget: "string" } }
              - { name: "detailsAr", widget: "hidden" }
              - { name: "detailsHi", widget: "hidden" }
              - { label: "Font Awesome icon name", name: "icon", widget: "string", default: "fa-stethoscope" }
              - { label: "myFatoorah payment link", name: "paymentLink", widget: "string", required: false, hint: "Optional HTTPS payment link. Leave blank to omit payment for this service." }
              - { label: "Show on website", name: "enabled", widget: "boolean", default: true }

  - name: "shop"
    label: "Shop and products"
    files:
      - name: "products"
        label: "Product catalogue"
        file: "js/content/shop.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}} KWD"
            fields:
              - { label: "Product name", name: "name", widget: "string" }
              - { name: "nameHi", widget: "hidden" }
              - { label: "Description", name: "description", widget: "text" }
              - { name: "descriptionHi", widget: "hidden" }
              - { label: "Price (KWD)", name: "price", widget: "number", value_type: "float", min: 0 }
              - { label: "Product image path", name: "image", widget: "string", hint: "Use an existing path such as img/products/glucosamine.svg, or upload an image and use its path." }
              - { label: "Category", name: "category", widget: "select", options: ["Medicines", "Supplements", "Medical Devices"] }
              - { label: "Show on home page", name: "featured", widget: "boolean", default: false }
              - { label: "In stock", name: "inStock", widget: "boolean", default: true }
              - { label: "myFatoorah payment link", name: "paymentLink", widget: "string", required: false, hint: "Optional HTTPS payment URL. Leave blank to use WhatsApp orders." }

  - name: "blog"
    label: "Blog"
    files:
      - name: "articles"
        label: "Articles"
        file: "js/content/blog.json"
        format: "json"
        fields:
          - label: "Articles"
            name: "blogPosts"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { name: "titleAr", widget: "hidden" }
              - { name: "titleHi", widget: "hidden" }
              - { label: "Short summary", name: "excerpt", widget: "text" }
              - { name: "excerptAr", widget: "hidden" }
              - { name: "excerptHi", widget: "hidden" }
              - { label: "Article", name: "body", widget: "text" }
              - { name: "bodyAr", widget: "hidden" }
              - { name: "bodyHi", widget: "hidden" }
              - { label: "Publication date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Category", name: "category", widget: "string", required: false }
              - { name: "categoryAr", widget: "hidden" }
              - { name: "categoryHi", widget: "hidden" }
              - { label: "Published", name: "published", widget: "boolean", default: false, hint: "Have a clinician review health information before publishing." }

  - name: "patient-info"
    label: "FAQs and reviews"
    files:
      - name: "faqs-reviews"
        label: "Frequently asked questions and testimonials"
        file: "js/content/patient-info.json"
        format: "json"
        fields:
          - label: "Frequently asked questions"
            name: "faqs"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Category", name: "category", widget: "string" }
              - { name: "categoryAr", widget: "hidden" }
              - { name: "categoryHi", widget: "hidden" }
              - { label: "Question", name: "question", widget: "string" }
              - { name: "questionAr", widget: "hidden" }
              - { name: "questionHi", widget: "hidden" }
              - { label: "Answer", name: "answer", widget: "text" }
              - { name: "answerAr", widget: "hidden" }
              - { name: "answerHi", widget: "hidden" }
              - { label: "Show on website", name: "enabled", widget: "boolean", default: true }
          - label: "Patient testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Patient display name", name: "name", widget: "string", hint: "Use an anonymous display name if preferred." }
              - { label: "Testimonial", name: "quote", widget: "text" }
              - { name: "quoteAr", widget: "hidden" }
              - { name: "quoteHi", widget: "hidden" }
              - { label: "Patient photo path (optional)", name: "image", widget: "string", required: false }
              - { label: "Patient consent confirmed", name: "consentConfirmed", widget: "boolean", default: false }
              - { label: "Approved by clinic", name: "approved", widget: "boolean", default: false }

  - name: "health-resources"
    label: "Patient resources"
    files:
      - name: "resources"
        label: "Health information and alerts"
        file: "js/content/health-resources.json"
        format: "json"
        fields:
          - label: "Emergency information"
            name: "emergencyInfo"
            widget: "object"
            fields:
              - { label: "Emergency number", name: "emergencyNumber", widget: "string" }
              - { name: "emergencyNumberAr", widget: "hidden" }
              - { label: "Emergency message", name: "emergencyMessage", widget: "text" }
              - { name: "emergencyMessageAr", widget: "hidden" }
              - { name: "emergencyMessageHi", widget: "hidden" }
          - label: "First aid guides"
            name: "firstAidSections"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "Heading", name: "title", widget: "string" }
              - { name: "titleAr", widget: "hidden" }
              - { label: "Guidance", name: "body", widget: "text" }
              - { name: "bodyAr", widget: "hidden" }
              - { label: "Show on website", name: "enabled", widget: "boolean", default: false, hint: "Publish only after clinician review." }
          - label: "Procedure preparation guides"
            name: "preparationGuides"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { name: "titleAr", widget: "hidden" }
              - { label: "Instructions", name: "body", widget: "text" }
              - { name: "bodyAr", widget: "hidden" }
              - { label: "Published", name: "published", widget: "boolean", default: false, hint: "Publish only after the clinic verifies the procedure-specific instructions." }
          - label: "Vaccination schedule"
            name: "vaccinationSchedule"
            widget: "list"
            required: false
            summary: "{{fields.ageGroup}} — {{fields.vaccine}}"
            fields:
              - { label: "Age group", name: "ageGroup", widget: "string" }
              - { name: "ageGroupHi", widget: "hidden" }
              - { label: "Vaccine or schedule item", name: "vaccine", widget: "string" }
              - { name: "vaccineAr", widget: "hidden" }
              - { name: "vaccineHi", widget: "hidden" }
              - { label: "Details", name: "details", widget: "text" }
              - { name: "detailsAr", widget: "hidden" }
              - { name: "detailsHi", widget: "hidden" }
              - { label: "Publish", name: "published", widget: "boolean", default: false, hint: "Verify against a current official Kuwait MOH source and have a clinician review it." }
          - label: "Prayer times"
            name: "prayerTimes"
            widget: "list"
            required: false
            summary: "{{fields.date}}"
            fields:
              - { label: "Date", name: "date", widget: "string", hint: "Use YYYY-MM-DD. Only today's schedule is shown." }
              - { label: "Fajr", name: "fajr", widget: "string" }
              - { label: "Dhuhr", name: "dhuhr", widget: "string" }
              - { label: "Asr", name: "asr", widget: "string" }
              - { label: "Maghrib", name: "maghrib", widget: "string" }
              - { label: "Isha", name: "isha", widget: "string" }
              - { label: "Verified source", name: "source", widget: "string" }
              - { name: "sourceHi", widget: "hidden" }
              - { label: "Publish", name: "published", widget: "boolean", default: false }
          - label: "Ramadan guidance"
            name: "ramadanGuidance"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { name: "titleAr", widget: "hidden" }
              - { name: "titleHi", widget: "hidden" }
              - { label: "Guidance", name: "body", widget: "text" }
              - { name: "bodyAr", widget: "hidden" }
              - { name: "bodyHi", widget: "hidden" }
              - { label: "Publish", name: "published", widget: "boolean", default: false, hint: "Clinician review required. Avoid individualized fasting or medication advice." }
          - label: "Seasonal health alerts"
            name: "seasonalHealthAlerts"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { name: "titleAr", widget: "hidden" }
              - { name: "titleHi", widget: "hidden" }
              - { label: "Message", name: "body", widget: "text" }
              - { name: "bodyAr", widget: "hidden" }
              - { name: "bodyHi", widget: "hidden" }
              - { label: "Start date (optional)", name: "startDate", widget: "string", required: false }
              - { label: "End date (optional)", name: "endDate", widget: "string", required: false }
              - { label: "Publish", name: "published", widget: "boolean", default: false, hint: "Use current, verified sources. This is not an emergency alert service." }
